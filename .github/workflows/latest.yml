name: Latest build

# Пересобирает и перезаливает "плавающий" пререлиз с тегом `latest` на
# каждый push в main — чтобы всегда было куда качать самую свежую сборку
# без необходимости вручную тегировать каждый коммит. Помечен как
# prerelease, поэтому GitHub API `releases/latest` (используется кнопкой
# на сайте) его игнорирует и всегда возвращает последний настоящий
# версионный релиз (см. release.yml) — `latest` виден только тем, кто
# явно открыл /releases/tag/latest.
#
# matrix.max-parallel: 1 — три платформы собираются по очереди, а не
# параллельно, чтобы не было гонки за создание/апдейт одного и того же
# GitHub Release с трёх раннеров одновременно.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # См. комментарий в release.yml — universal-apple-darwin сборка ggml
      # падает без явного deployment target (std::filesystem недоступен
      # ниже 10.15 в дефолте для этой цели); реально работает только
      # CMAKE_OSX_DEPLOYMENT_TARGET (build.rs форвардит CMAKE_*-переменные
      # напрямую в cmake как -D), просто MACOSX_DEPLOYMENT_TARGET CMake
      # почему-то не подхватывает в этом сценарии.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # См. комментарий в ci.yml — sherpa-rs-sys кэширует бинарники вне
          # target/, rust-cache должен кэшировать их тоже, иначе линковка
          # падает на восстановленном (не свежем) кэше.
          cache-directories: |
            ~/Library/Caches/sherpa-rs
            ~/.cache/sherpa-rs
            ~/AppData/Local/sherpa-rs

      - name: Установить Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Системные зависимости (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev

      - name: npm ci
        run: npm ci

      - name: Подготовить Frameworks для macOS-бандла
        # См. комментарий в release.yml — Tauri не копирует dylib'ы ASR-бэкенда
        # в .app сам, без этого шага dyld не находит их при запуске и macOS
        # показывает "dikta cannot be opened because of a problem". Собираем
        # ТОЛЬКО -p sherpa-rs-sys (не весь dikta) — у dikta build.rs зовёт
        # tauri_build::build(), которая падает, если Frameworks/ ещё не
        # существует; у sherpa-rs-sys независимый build.rs, просто копирующий
        # готовые onnxruntime/sherpa-onnx в target/.
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: |
          cargo build --release --target aarch64-apple-darwin -p sherpa-rs-sys
          mkdir -p Frameworks
          cp -L target/aarch64-apple-darwin/release/libonnxruntime.1.17.1.dylib Frameworks/
          cp -L target/aarch64-apple-darwin/release/libsherpa-onnx-c-api.dylib Frameworks/
          cp -L target/aarch64-apple-darwin/release/libsherpa-onnx-cxx-api.dylib Frameworks/

      - name: Собрать и обновить пререлиз latest
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: latest
          releaseName: "Дикта — последняя сборка (main)"
          releaseBody: "Автоматическая сборка последнего коммита в main: ${{ github.sha }}. Может быть нестабильной — для проверенной версии смотрите обычные релизы."
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
