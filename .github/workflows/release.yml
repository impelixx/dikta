name: Release

# Собирает и публикует инсталляторы при пуше тега вида v1.2.3.
# Релиз создаётся черновиком (draft) — перед публикацией стоит проверить
# сборки руками, особенно на macOS (приложение не подписано сертификатом
# Apple Developer, при первом запуске потребуется обойти Gatekeeper:
# System Settings → Privacy & Security → "Open Anyway").
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Установить Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Системные зависимости (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev

      - name: npm ci
        run: npm ci

      - name: Собрать и опубликовать релиз
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Дикта ${{ github.ref_name }}"
          releaseBody: "Автоматическая сборка. Полный список изменений — в истории коммитов."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
