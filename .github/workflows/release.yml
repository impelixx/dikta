name: Release

# Собирает и публикует инсталляторы при пуше тега вида v1.2.3.
# Релиз создаётся черновиком (draft) — перед публикацией стоит проверить
# сборки руками, особенно на macOS (приложение не подписано сертификатом
# Apple Developer, при первом запуске потребуется обойти Gatekeeper:
# System Settings → Privacy & Security → "Open Anyway").
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # Без явного deployment target universal-apple-darwin сборка ggml
      # (whisper.cpp) падает: ggml-backend-reg.cpp использует std::filesystem,
      # а SDK помечает его недоступным ниже 10.15, если таргет не задан явно
      # (обычный однoархитектурный `cargo build` в ci.yml этого не ловит —
      # там свой дефолт от тулчейна, тут — из-за universal x86_64+aarch64).
      # MACOSX_DEPLOYMENT_TARGET сам по себе не сработал (CMake его почему-то
      # игнорирует при принудительно заданном CMAKE_OSX_ARCHITECTURES) —
      # build.rs крейта whisper-rs-sys явно форвардит в cmake любую
      # переменную окружения с префиксом CMAKE_ как -D<имя>=<значение>,
      # так что реально работает только CMAKE_OSX_DEPLOYMENT_TARGET.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # См. комментарий в ci.yml — sherpa-rs-sys кэширует бинарники вне
          # target/, rust-cache должен кэшировать их тоже, иначе линковка
          # падает на восстановленном (не свежем) кэше.
          cache-directories: |
            ~/Library/Caches/sherpa-rs
            ~/.cache/sherpa-rs
            ~/AppData/Local/sherpa-rs

      - name: Установить Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Системные зависимости (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev

      - name: npm ci
        run: npm ci

      - name: Подготовить Frameworks для macOS-бандла
        # Tauri сам не копирует dylib'ы ASR-бэкенда (onnxruntime, sherpa-onnx)
        # в .app — их нужно заранее положить туда, куда указывает
        # bundle.macOS.frameworks в tauri.conf.json, иначе dyld не находит их
        # при запуске готового приложения ("dikta cannot be opened because of
        # a problem"). Собираем ТОЛЬКО крейт sherpa-rs-sys (-p), а не весь
        # dikta: build.rs пакета dikta вызывает tauri_build::build(), а тот
        # сам проверяет на этапе компиляции, что файлы из frameworks уже
        # существуют — сборка dikta до появления Frameworks/ падает. У
        # sherpa-rs-sys свой независимый build.rs, который просто скачивает и
        # копирует готовые дистрибутивы onnxruntime/sherpa-onnx в target/ —
        # он не завязан на tauri_build и ничего не проверяет заранее.
        # Собираем один раз под aarch64: sherpa-rs-sys раздаёт уже
        # universal-бинарники, так что arm64- и x86_64-сборки используют один
        # и тот же dylib — лишний lipo не нужен.
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: |
          cargo build --release --target aarch64-apple-darwin -p sherpa-rs-sys
          # rust-cache иногда восстанавливает target/ частичным совпадением
          # ("full match: false") — Cargo видит валидный fingerprint и не
          # перезапускает build.rs, а сам скачанный dylib из этого частичного
          # снапшота на деле отсутствует (копирование файла внутри build.rs
          # не отслеживается fingerprint'ом). Если файла нет — форсируем
          # пересборку именно этого крейта.
          if [ ! -f target/aarch64-apple-darwin/release/libonnxruntime.1.17.1.dylib ]; then
            echo "dylib отсутствует после кэшированной сборки — форсируем пересборку sherpa-rs-sys"
            cargo clean --release --target aarch64-apple-darwin -p sherpa-rs-sys
            cargo build --release --target aarch64-apple-darwin -p sherpa-rs-sys
          fi
          mkdir -p Frameworks
          cp -L target/aarch64-apple-darwin/release/libonnxruntime.1.17.1.dylib Frameworks/
          cp -L target/aarch64-apple-darwin/release/libsherpa-onnx-c-api.dylib Frameworks/
          cp -L target/aarch64-apple-darwin/release/libsherpa-onnx-cxx-api.dylib Frameworks/

      - name: Собрать и опубликовать релиз
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Дикта ${{ github.ref_name }}"
          releaseBody: "Автоматическая сборка. Полный список изменений — в истории коммитов."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
