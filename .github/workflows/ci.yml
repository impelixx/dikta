name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # sherpa-rs-sys скачивает готовые библиотеки sherpa-onnx/onnxruntime
          # не в target/, а в системный кэш (dirs::cache_dir()/"sherpa-rs").
          # rust-cache кэширует только target/ — без этого при восстановлении
          # кэша Cargo видит валидный fingerprint build.rs (значит, повторно
          # его не запускает), но библиотек на свежем раннере физически нет,
          # и линковка падает с "library not found"/cannot open input file.
          cache-directories: |
            ~/Library/Caches/sherpa-rs
            ~/.cache/sherpa-rs
            ~/AppData/Local/sherpa-rs

      - name: Системные зависимости (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev

      - name: Подготовить Frameworks для macOS-бандла
        # tauri.conf.json объявляет bundle.macOS.frameworks (dylib'ы ASR-бэкенда,
        # нужны для запуска собранного .app — см. release.yml). tauri_build::build()
        # в build.rs пакета dikta проверяет на этапе компиляции, что эти файлы
        # уже лежат в src-tauri/Frameworks — иначе сборка dikta падает с
        # "Library not found". Собираем ТОЛЬКО -p sherpa-rs-sys (не dikta), у
        # него независимый build.rs, который просто копирует готовые
        # onnxruntime/sherpa-onnx в target/, ничего не проверяя заранее.
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: |
          cargo build --release -p sherpa-rs-sys
          # rust-cache иногда восстанавливает target/ частичным совпадением
          # ("full match: false") — Cargo видит валидный fingerprint и не
          # перезапускает build.rs, а сам скачанный dylib из этого частичного
          # снапшота на деле отсутствует (копирование файла внутри build.rs
          # не отслеживается fingerprint'ом). Если файла нет — форсируем
          # пересборку именно этого крейта.
          if [ ! -f target/release/libonnxruntime.1.17.1.dylib ]; then
            echo "dylib отсутствует после кэшированной сборки — форсируем пересборку sherpa-rs-sys"
            cargo clean --release -p sherpa-rs-sys
            cargo build --release -p sherpa-rs-sys
          fi
          mkdir -p Frameworks
          cp -L target/release/libonnxruntime.1.17.1.dylib Frameworks/
          cp -L target/release/libsherpa-onnx-c-api.dylib Frameworks/
          cp -L target/release/libsherpa-onnx-cxx-api.dylib Frameworks/

      - name: cargo build
        working-directory: src-tauri
        run: cargo build --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --locked
