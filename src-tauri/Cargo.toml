[package]
name = "dikta"
version = "0.1.0"
description = "Локальная диктовка на русском (GigaAM) через Tauri"
authors = ["impelixx"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dikta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries", "sys"] }
rusqlite = { version = "0.32", features = ["bundled"] }
enigo = "0.3"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
ureq = { version = "2.10", features = ["tls", "json"] }
tar = "0.4"
bzip2 = "0.4"
whisper-rs = { version = "0.16", default-features = false }
nnnoiseless = { version = "0.5.2", default-features = false }

# GPU-ускорение через Metal только на macOS — Cargo объединяет фичи с
# базовым объявлением выше, отдельно объявлять зависимость второй раз не нужно.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

[dev-dependencies]
hound = "3.5"

